name: CI/CD Pipeline Solo

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: write # Permissão obrigatória para o bot criar a Release

jobs:
  # ==========================================
  # JOB 1: INTEGRAÇÃO CONTÍNUA (CI)
  # ==========================================
  testes:
    name: Compilar e Testar
    # Não roda quando o evento é só o fechamento/merge do PR (já foi testado no push/synchronize)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Você pode alterar para a versão que está usando (ex: 17)
          distribution: 'temurin'

      - name: Executar Testes Unitários
        run: |
          chmod +x mvnw
          ./mvnw -B test

  testes-frontend:
    name: Testar Frontend
    # Não roda quando o evento é só o fechamento/merge do PR (já foi testado no push/synchronize)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar Testes
        working-directory: frontend
        run: npx vitest run

      - name: Verificar Build de Produção
        working-directory: frontend
        run: npm run build

  # ==========================================
  # JOB 2: ENTREGA CONTÍNUA (CD) - AUTO RELEASE
  # ==========================================
  release:
    name: Criar Release no GitHub
    # Roda só quando um PR de release/* é mesclado na main
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extrair versão do CHANGELOG.md
        id: extract_version
        run: |
          VERSION=$(head -1 CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Não foi possível extrair a versão da primeira linha '## [X.Y.Z]' do CHANGELOG.md"
            exit 1
          fi
          echo "VERSION=v$VERSION" >> "$GITHUB_ENV"

      - name: Verificar se a release já existe
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::A release $VERSION já existe. Abortando para evitar duplicidade."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar tag e publicar Release
        run: |
          echo "Gerando tag e Release automática para ${VERSION}"
          gh release create "$VERSION" \
            --target main \
            --title "Release ${VERSION}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
